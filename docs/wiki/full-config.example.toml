# Full reference configuration for google-drive-ocamlfuse.
#
# This file is intentionally verbose and commented. The application does not
# generate this form automatically; generated config files stay minimal and
# usually contain only non-default values.
#
# The live config file is still named `config`.
# Comments are allowed in real config files.

config_version = 1

[auth]
# OAuth2 client ID and secret.
client_id = ""
client_secret = ""

# OAuth2 verification code. Useful when authorizing on a different machine.
verification_code = ""

# Optional scope override.
scope = ""

# Optional redirect URI override.
redirect_uri = ""

# Use loopback OAuth flow and port.
oauth2_loopback = true
oauth2_loopback_port = 8080

# Service account support.
service_account_credentials_path = ""
service_account_user_to_impersonate = ""

[mount]
# Metadata cache lifetime in seconds.
metadata_cache_time = 60

# Mount read-only.
read_only = false

# Example umask. The effective default at first creation comes from the current
# process umask.
umask = "0o022"

# Restrict the visible root folder or Team Drive.
root_folder = ""
team_drive_id = ""

# Extra filesystem behavior.
lost_and_found = false
disable_trash = false
delete_forever_in_trash_folder = false
keep_duplicates = false
mv_keep_target = false

[docs]
# Download and expose Google Docs export formats.
download_docs = true
docs_file_extension = true

# Export formats.
document_format = "desktop"
drawing_format = "desktop"
form_format = "desktop"
presentation_format = "desktop"
spreadsheet_format = "desktop"
map_format = "desktop"
fusion_table_format = "desktop"
apps_script_format = "desktop"

# Optional icons used when the corresponding format is `desktop`.
document_icon = ""
drawing_icon = ""
form_icon = ""
presentation_icon = ""
spreadsheet_icon = ""
map_icon = ""
fusion_table_icon = ""
apps_script_icon = ""

# Desktop-entry behavior.
desktop_entry_exec = ""
desktop_entry_as_html = false

[cache]
# Cache sizing and persistence paths.
max_cache_size_mb = 512
metadata_memory_cache = true
metadata_memory_cache_saving_interval = 30
sqlite3_busy_timeout = 5000
data_directory = ""
cache_directory = ""
log_directory = ""

[io]
# Streaming and buffering.
stream_large_files = false
large_file_threshold_mb = 16
large_file_read_only = false
memory_buffer_size = 1048576
max_memory_cache_size = 10485760
read_ahead_buffers = 3
write_buffers = false

# Upload and MIME behavior.
max_upload_chunk_size = 1099511627776
autodetect_mime = true
acknowledge_abuse = false

[network]
# Connection and transfer behavior.
connect_timeout_ms = 5000
max_download_speed = "0"
max_upload_speed = "0"
low_speed_limit = 0
low_speed_time = 0
max_retries = 8
curl_debug_off = false

[async]
# Background upload/fetch behavior.
async_upload_queue = false
async_upload_threads = 10
async_upload_queue_max_length = 0
background_folder_fetching = false

[logging]
# Logging destination and buffer debug.
log_to = ""
debug_buffers = false
